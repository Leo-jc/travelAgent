spring:
  application:
    name: travelAgent
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true  # 允许Bean定义覆盖，解决自动配置冲突
server:
    port: 8123
    servlet:
      context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.serain.travelagent.model.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

